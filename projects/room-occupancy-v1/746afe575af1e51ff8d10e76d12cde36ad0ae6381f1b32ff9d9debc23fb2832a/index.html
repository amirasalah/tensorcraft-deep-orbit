<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Room occupancy experiment</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
        line-height: 1.6;
      }
      body {
        max-width: 42rem;
        margin: 3rem auto;
        padding: 0 1rem;
      }
      form {
        display: grid;
        gap: 1rem;
      }
      label {
        display: grid;
        gap: 0.3rem;
      }
      input,
      button {
        font: inherit;
        padding: 0.65rem;
        border: 1px solid #888;
        border-radius: 0.3rem;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: default;
        opacity: 0.6;
      }
      output {
        display: block;
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <h1>Room occupancy experiment</h1>
    <p>
      Enter sensor readings using the units below. This app loads your saved
      classifier and preprocessing files. It is an experiment on one room, not a
      building-control system.
    </p>
    <p id="status" role="status">Loading the saved model…</p>
    <form id="predict-form">
      <div id="fields"></div>
      <button id="predict" disabled>Predict occupancy</button>
    </form>
    <output id="result" aria-live="polite"></output>
    <p id="details"></p>
    <script src="/vendor/tf.min.js"></script>
    <script type="module" src="/app.mjs"></script>
  </body>
</html>
